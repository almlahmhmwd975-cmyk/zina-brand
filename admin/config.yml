# نوع الربط مع السيرفر الخلفي (سنستخدم نظام Vercel و GitHub المجاني)
backend:
  name: git-gateway
  branch: main

# المجلد المخصص لرفع وحفظ صور الإكسسوارات فيه مجاناً
media_folder: "images"
public_folder: "/images"

# إعداد واجهة التحكم باللغة العربية وخانات إدخال المنتجات لزينة
collections:
  - name: "products"
    label: "المنتجات والإكسسوارات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم الإكسسوار / القطعة", name: "title", widget: "string" }
      - { label: "السعر بالجنيه", name: "price", widget: "string" }
      - { label: "صورة المنتج", name: "image", widget: "image" }
      - { label: "حالة المنتج (مثال: الأكثر مبيعاً، جديد، إلخ)", name: "badge", widget: "string", required: false }
      - { label: "وصف تفصيلي للقطعة", name: "body", widget: "markdown", required: false }
