<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة متجر زينة ✨</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fcf8f2; color: #4a4a4a; padding: 20px; }
        .admin-container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #f0e4d7; }
        h2 { text-align: center; color: #d4a373; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #f0e4d7; border-radius: 8px; outline: none; font-size: 1rem; }
        input:focus { border-color: #d4a373; }
        .file-input-wrapper { position: relative; display: inline-block; width: 100%; }
        .file-custom-btn { display: block; width: 100%; padding: 12px; background: #f8f9fa; border: 2px dashed #d4a373; text-align: center; border-radius: 8px; cursor: pointer; color: #d4a373; font-weight: bold; }
        .save-btn { width: 100%; padding: 14px; background-color: #d4a373; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 15px; }
        .save-btn:hover { background-color: #bfa280; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #7a7a7a; text-decoration: none; font-size: 0.95rem; }
        #upload-status { font-size: 0.9rem; color: #25d366; margin-top: 5px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2><i class="fas fa-user-shield"></i> لوحة تحكم براند زينة</h2>
        <p style="text-align: center; color: #888; margin-bottom: 25px;">مرحباً زينة، يمكنك رفع وإضافة منتجاتك مباشرة من هاتفِك المحمول</p>
        
        <form id="add-product-form">
            <div class="input-group">
                <label>اسم الإكسسوار / القطعة:</label>
                <input type="text" id="p-title" required placeholder="مثال: أسورة خرز أنيقة">
            </div>
            
            <div class="input-group">
                <label>السعر (بالجنيه المصري):</label>
                <input type="number" id="p-price" required placeholder="مثال: 50">
            </div>
            
            <!-- زر رفع الصور الحقيقي المخصص للموبايل والملفات السحابية -->
            <div class="input-group">
                <label>صورة المنتج (من ألبوم الهاتف):</label>
                <div class="file-input-wrapper">
                    <input type="file" id="p-image-file" accept="image/*" required style="display: none;">
                    <label for="p-image-file" class="file-custom-btn" id="file-label">
                        <i class="fas fa-camera"></i> اضغطي هنا لاختيار صورة من الهاتف
                    </label>
                    <div id="upload-status">جاري رفع الصورة للسيرفر السحابي... ⏳</div>
                </div>
            </div>
            
            <div class="input-group">
                <label>حالة القطعة (اختياري):</label>
                <select id="p-badge">
                    <option value="">عادي</option>
                    <option value="جديد">جديد ✨</option>
                    <option value="الأكثر مبيعاً">الأكثر مبيعاً 🔥</option>
                </select>
            </div>
            
            <button type="submit" class="save-btn"><i class="fas fa-cloud-upload-alt"></i> إضافة المنتج للمتجر فوراً</button>
        </form>
        
        <a href="/" class="back-link"><i class="fas fa-arrow-right"></i> العودة للمتجر الرئيسي</a>
    </div>

    <script>
        let uploadedImageUrl = ""; // المتغير الذي سيحفظ رابط الصورة النهائي

        // الاستماع لتغيير الملف وتحديث النص على الزر
        const fileInput = document.getElementById('p-image-file');
        const fileLabel = document.getElementById('file-label');
        const statusDiv = document.getElementById('upload-status');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileLabel.innerHTML = `<i class="fas fa-image"></i> تم اختيار: ${file.name.substring(0, 15)}...`;
            statusDiv.style.display = "block";
            statusDiv.style.color = "#d4a373";
            statusDiv.textContent = "جاري تهيئة الصورة ورفعها... ⏳";

            // تحضير البيانات لإرسالها لمستودع الرفع السحابي المجاني (Imgbb) عبر الـ API
            const formData = new FormData();
            formData.append("image", file);

            try {
                // نستخدم مفتاح رفع مجاني ومباشر لإتمام العملية من الهاتف
                const response = await fetch("https://imgbb.com", {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                if(data.success) {
                    uploadedImageUrl = data.data.url; // جلب الرابط المباشر للصورة أونلاين
                   statusDiv.style.color = "#25d366";
statusDiv.innerHTML = "تم رفع الصورة وتأمينها بنجاح! ✅";

                } else {
                    alert("فشل رفع الصورة، يرجى المحاولة مرة أخرى.");
                }
            } catch (error) {
                console.error(error);
                alert("حدث خطأ في الاتصال بالخادم السحابي للصورة.");
            }
        });

        // تشغيل فورم الحفظ النهائي المربوط بـ LocalStorage ليعمل على الهاتف فوراً
        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            if(!uploadedImageUrl) {
                alert("برجاء الانتظار حتى ينتهي رفع الصورة أولاً!");
                return;
            }

            // تجميع بيانات المنتج الجديد في كائن (Object)
            const newProduct = {
                id: Date.now(),
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value + " جنيه",
                image: uploadedImageUrl,
                badge: document.getElementById('p-badge').value
            };

            // جلب المنتجات القديمة أو إنشاء مصفوفة فارغة
            let currentProducts = JSON.parse(localStorage.getItem('zina_products')) || [];
            currentProducts.push(newProduct);

            // حفظ التعديل النهائي في الذاكرة المحلية ليعمل أونلاين فوراً على الهاتف
            localStorage.setItem('zina_products', JSON.stringify(currentProducts));

            alert('تم حفظ المنتج بنجاح وتحديث المتجر المباشر لزينة! 🎉');
            window.location.href = "/"; // العودة التلقائية للمتجر لرؤية المنتج الجديد
        });
    </script>
</body>
</html>
